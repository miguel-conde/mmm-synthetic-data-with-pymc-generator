[project]
name = "mmm-synthetic-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arviz>=1.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nutpie>=0.16.11",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pymc>=6.3.2",
    "pymc-generator",
    "pymc-marketing>=1.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost-cpu>=3.4.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
pymc-generator = { git = "https://github.com/pymc-labs/pymc-generator", rev = "fb9549d78f0515d89c739c6d4c9f3a29d4a47c26" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["slow: compiles PyTensor graphs or samples MCMC"]
